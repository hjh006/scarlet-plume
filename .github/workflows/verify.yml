name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: development
      APP_DB_NAME: scarlet_plume_ci
      APP_DB_USER: scarlet_plume_ci
      APP_DB_HOST: 127.0.0.1
      APP_DB_PORT: 55432
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - run: python -m pip install -r requirements.txt
      - name: Start PostgreSQL
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "APP_DB_PASSWORD=$password" >> "$GITHUB_ENV"
          APP_DB_PASSWORD="$password" docker compose up -d --wait --wait-timeout 90 db
      - name: Verify migrations and run tests
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py test --noinput
