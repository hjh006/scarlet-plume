name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: development
      APP_DB_NAME: scarlet_plume_ci
      APP_DB_USER: scarlet_plume_ci
      APP_DB_HOST: 127.0.0.1
      APP_DB_PORT: 55432
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - run: python -m pip install -r requirements.txt
      - name: Start PostgreSQL
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "APP_DB_PASSWORD=$password" >> "$GITHUB_ENV"
          APP_DB_PASSWORD="$password" docker compose up -d --wait --wait-timeout 90 db
      - name: Verify migrations and run tests
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py test --noinput
      - name: Verify source-side Wazuh projection
        run: python -m unittest discover -s docker/wazuh -p 'test_*.py' -v

  next-stack:
    name: Verify Go and Vue (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_DB_NAME: scarlet_plume_go_ci
      APP_DB_USER: scarlet_plume_go_ci
      APP_DB_HOST: 127.0.0.1
      APP_DB_PORT: 55432
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Start PostgreSQL
        run: |
          password="$(openssl rand -hex 24)"
          dsn="postgres://${APP_DB_USER}:$password@${APP_DB_HOST}:${APP_DB_PORT}/${APP_DB_NAME}?sslmode=disable"
          echo "::add-mask::$password"
          echo "::add-mask::$dsn"
          echo "PLUME_STORE_TEST_DSN=$dsn" >> "$GITHUB_ENV"
          echo "APP_DB_PASSWORD=$password" >> "$GITHUB_ENV"
          APP_DB_PASSWORD="$password" docker compose up -d --wait --wait-timeout 90 db
      - name: Create Django history fixture
        env:
          APP_ENV: development
        run: |
          docker compose exec -T db sh -c 'PGPASSWORD="$POSTGRES_PASSWORD" createdb -h 127.0.0.1 -U "$POSTGRES_USER" scarlet_plume_legacy_ci'
          export APP_DB_NAME=scarlet_plume_legacy_ci
          dsn="postgres://${APP_DB_USER}:$APP_DB_PASSWORD@${APP_DB_HOST}:${APP_DB_PORT}/${APP_DB_NAME}?sslmode=disable"
          echo "::add-mask::$dsn"
          echo "PLUME_LEGACY_TEST_DSN=$dsn" >> "$GITHUB_ENV"
          python -m pip install -r requirements.txt
          python manage.py migrate --noinput
          APP_PROVISION_PASSWORD="$(openssl rand -hex 24)" python manage.py provision_workspace Django_History 'Django import fixture' legacy-import-owner
          APP_PROVISION_PASSWORD="$(openssl rand -hex 24)" python manage.py provision_workspace Django_History 'Django import fixture' legacy-import-reviewer --role reviewer
          python manage.py seed_demo Django_History
      - name: Verify Go backend and connectors
        working-directory: backend
        run: |
          # Integration packages share one database and the global job queue.
          go test -race -p 1 ./...
          go vet ./...
      - name: Build Vue console
        working-directory: web
        run: |
          npm ci
          npm run build

  native-discovery:
    name: Verify native discovery (MySQL, MariaDB, MongoDB)
    # MongoDB 8.0 rejects the current latest/24.04 kernel (SERVER-121912).
    # 22.04 currently supplies kernel 6.8; upgrade after the upstream fix.
    # https://jira.mongodb.org/browse/SERVER-121912
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    # These credentials belong only to disposable synthetic CI services.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: scarlet-native-ci-fixture
          MYSQL_DATABASE: discovery_sample
          MYSQL_USER: discovery_reader
          MYSQL_PASSWORD: scarlet-native-ci-fixture
        ports:
          - 13306:3306
        options: >-
          --health-cmd "mysqladmin ping --host=127.0.0.1 --silent"
          --health-interval 5s --health-timeout 5s --health-retries 24
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: scarlet-native-ci-fixture
          MARIADB_DATABASE: discovery_sample
          MARIADB_USER: discovery_reader
          MARIADB_PASSWORD: scarlet-native-ci-fixture
        ports:
          - 13307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 24
      mongodb:
        image: mongo:8.0
        env:
          MONGO_INITDB_ROOT_USERNAME: discovery_admin
          MONGO_INITDB_ROOT_PASSWORD: scarlet-native-ci-fixture
        ports:
          - 12717:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)'"
          --health-interval 5s --health-timeout 5s --health-retries 24
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Initialize synthetic fixtures and read-only accounts
        shell: bash
        run: |
          ci_password='scarlet-native-ci-fixture'
          echo "::add-mask::$ci_password"
          export MYSQL_PWD="$ci_password"
          docker exec -i -e MYSQL_PWD '${{ job.services.mysql.id }}' \
            mysql --user=root --default-character-set=utf8mb4 \
            < docker/discovery-sample/mysql.sql > /dev/null
          docker exec -i -e MYSQL_PWD '${{ job.services.mariadb.id }}' \
            mariadb --user=root --default-character-set=utf8mb4 \
            < docker/discovery-sample/mysql.sql > /dev/null
          docker cp docker/discovery-sample/mongo.js \
            '${{ job.services.mongodb.id }}:/tmp/discovery-sample.js'
          docker exec '${{ job.services.mongodb.id }}' mongosh --quiet --nodb --eval \
            'db = new Mongo("mongodb://127.0.0.1:27017").getDB("admin"); db.auth("discovery_admin", process.env.MONGO_INITDB_ROOT_PASSWORD); load("/tmp/discovery-sample.js");' \
            > /dev/null
          mysql_dsn="discovery_reader:$ci_password@tcp(127.0.0.1:13306)/discovery_sample"
          mariadb_dsn="discovery_reader:$ci_password@tcp(127.0.0.1:13307)/discovery_sample"
          mongo_dsn="mongodb://discovery_reader:$ci_password@127.0.0.1:12717/discovery_sample?authSource=discovery_sample"
          echo "::add-mask::$mysql_dsn"
          echo "::add-mask::$mariadb_dsn"
          echo "::add-mask::$mongo_dsn"
          printf 'SCARLET_MYSQL_TEST_DSN=%s\n' "$mysql_dsn" >> "$GITHUB_ENV"
          printf 'SCARLET_MARIADB_TEST_DSN=%s\n' "$mariadb_dsn" >> "$GITHUB_ENV"
          printf 'SCARLET_MONGO_TEST_DSN=%s\n' "$mongo_dsn" >> "$GITHUB_ENV"
      - name: Verify real native collector samples
        working-directory: backend
        run: go test -race -p 1 ./internal/collector -run '^TestDiscovery(MySQL|MariaDB|Mongo)Live$' -count=1 -timeout=90s -v

  endpoint-windows:
    name: Verify Windows clipboard code and PowerShell syntax
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Parse public deployment scripts without executing them
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSEdition -ne 'Desktop') { throw 'Windows PowerShell 5.1 Desktop is required for syntax validation.' }
          $scripts = @(Get-ChildItem -LiteralPath endpoint/windows-enterprise -Filter '*.ps1' -File)
          if ($scripts.Count -lt 9) { throw 'Deployment scripts are missing.' }
          foreach ($script in $scripts) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw ($script.Name + ': ' + (($parseErrors | ForEach-Object { $_.Message }) -join '; ')) }
          }
          Write-Output ('Parsed ' + $scripts.Count + ' scripts; no installer or clipboard operation was executed.')
      - name: Verify pure state, buffer and Windows ABI tests
        working-directory: backend
        shell: powershell
        run: |
          # Native fake/ABI tests never capture a live clipboard or install a task.
          go test ./internal/endpointnative -count=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./cmd/endpoint-agent ./internal/endpointnative
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
